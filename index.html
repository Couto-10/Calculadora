<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href= "css/style.css">
  <title>Calculadora</title>
</head>
<body>

<div class="divPai">
  <h2>Calculadora</h2>

  <div class="layout">

    <div class="card">
      <h3>Primeiro número</h3>
      <input type="number" class="num1">


    </div>

    <div class="card">
      <h3>Segundo número</h3>
      <input type="number" class="num2">
    </div>

    <div class="cardOperacoes">
      <button class="soma">+</button>
      <button class="subtracao">-</button>
      <button class="multiplicacao">*</button>
      <button class="divisao">÷</button>
    </div>

    <div class="cardResultado">
      <h3 class="resultado">Resultado:</h3>
      <p class="mensagemErro" style="color: red"></p>
      <p class="mensagemErroDivisao" style="color: red"></p>
    </div>
  </div>
</div>

<script src ="script.js"></script>
</body>
</html>
