<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <title>Calculadora</title>
</head>
<body>

<div class="container">
  <div class="layoutTema">
    <div class="modoClaro">
      <button class="botaoTema">Mudar tema</button>
    </div>
  </div>

  <div class="layout1">
    <p class="operacaoNum"></p>
    <h3 class="resultadoLayout"></h3>
    <p class="mensagemErro" style="color: red"></p>

  </div>



  <div class="container2">

    <div class="layout2">
      <button class="num">9</button>
      <button class="num">8</button>
      <button class="num">7</button>
      <button class="divisao">÷</button>
      <button class="num">6</button>
      <button class="num">5</button>
      <button class="num">4</button>
      <button class="multiplicacao">*</button>
      <button class="num">3</button>
      <button class="num">2</button>
      <button class="num">1</button>
      <button class="subtracao">-</button>
      <button class="num">0</button>
      <button class="excluir">⌫</button>
      <button class="soma">+</button>
      <button class="total">=</button>
    </div>
  </div>

</div>


<script src="script.js"></script>
</body>
</html>
